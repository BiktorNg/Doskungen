name: Bygg Windows-app
# Kör från fliken Actions ("Run workflow") eller genom att pusha en tagg som v1.2.0.
# Skapar en ny release med Doskungen-Setup.exe och Doskungen-Portabel.exe.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Doskungen i Västmyra ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          make_latest: true
          files: |
            windows/dist/Doskungen-Setup.exe
            windows/dist/Doskungen-Portabel.exe
